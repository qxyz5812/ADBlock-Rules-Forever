name: Sync file

on:
  schedule:
    - cron: '28 * * * *'
  #workflow_dispatch:

jobs:
  sync_file:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: release

      - name: Sync a single file from upstream
        run: |
          SOURCE_URL="https://johnshall.github.io/Shadowrocket-ADBlock-Rules-Forever/sr_cnip_ad.conf"
          TARGET_FILE="sr_cnip_ad.conf"
          echo "Downloading..."
          curl -sS -L "$SOURCE_URL" -o "$TARGET_FILE"

          echo "Downloading done"
          if [ ! -f "$TARGET_FILE" ]; then
            echo "Error: File was not downloaded. Aborting."
            exit 1
          fi

          echo "Downloading done"

          sed -i 's/DOMAIN-SUFFIX,bing.com,Proxy/DOMAIN-SUFFIX,bing.com,DIRECT/g' "$TARGET_FILE"
          echo "File content modified."

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if ! git diff --exit-code --quiet; then
            echo "File has changed. Committing and pushing..."
            git add "$TARGET_FILE"
            git commit -m "chore(sync): Update and modify $TARGET_FILE from upstream"
            git push origin release
          else
            echo "File is already up-to-date. No changes to commit."
          fi
